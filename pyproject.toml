[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colorcursor-converter"
version = "0.2.0"
description = "A tool to convert Windows cursor themes to a format for Linux."
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "PyQt6==6.9.1",
    "win2xcur==0.1.2"
]

[project.optional-dependencies]
dev = [
    "pyinstaller=6.15.0",
    "pytest>=8"
]

# [project.scripts]
# ccpy = "ccpy.cli:main"
# ccpy-gui = "ccpy.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccpy.core = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]